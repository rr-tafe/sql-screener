<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Assessment</title>
  <style>
__STYLE_CSS__
  </style>
</head>
<body>
  <div id="screen1" class="screen screen-start">
    <div class="start-card">
      <h1 id="module-title-heading"></h1>
      <p id="module-description"></p>
      <label for="candidate-name">Your Full Name</label>
      <input type="text" id="candidate-name" placeholder="Enter your full name" autocomplete="name" />
      <button id="begin-btn" class="btn-primary" disabled>Begin Test</button>
      <button id="resume-btn" class="btn-primary" hidden>Resume</button>
      <label class="restore-label" for="restore-file">Restore checkpoint</label>
      <input id="restore-file" type="file" accept=".json,application/json" />
      <p id="start-error" role="alert"></p>
    </div>
  </div>

  <div id="screen2" class="screen screen-main hidden">
    <aside id="sidebar" class="sidebar">
      <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">&#8249;</button>
      <div class="sidebar-content">
        <div class="timer-display" id="timer-display" aria-label="Elapsed time">00:00:00</div>
        <div id="sidebar-candidate-name" class="sidebar-candidate-name"></div>
        <div id="save-status" role="status" aria-live="polite"></div>
        <div class="session-actions">
          <button id="checkpoint-btn" title="Download recovery checkpoint" aria-label="Download recovery checkpoint" data-icon="Download"></button>
          <button id="clear-saved-btn" title="Clear saved progress" aria-label="Clear saved progress" data-icon="RotateCcw"></button>
        </div>
        <nav class="sidebar-nav" aria-label="Section navigation">
          <!-- Question links injected by app.js -->
        </nav>
        <!-- bottom action buttons injected by app.js -->
      </div>
    </aside>

    <div id="left-panel-resize-handle" class="panel-resize-handle" aria-hidden="true"></div>

    <main id="center-panel" class="center-panel">
      <div class="workspace-toolbar">
        <div class="question-navigation">
          <button id="previous-question" title="Previous question" aria-label="Previous question" data-icon="ChevronLeft"></button>
          <span id="question-position" aria-live="polite"></span>
          <button id="next-question" title="Next question" aria-label="Next question" data-icon="ChevronRight"></button>
        </div>
        <div class="view-switch" role="group" aria-label="Question view">
          <button id="focus-view" aria-pressed="true">Focus</button>
          <button id="all-view" aria-pressed="false">All questions</button>
        </div>
        <button id="data-panel-toggle" title="Show or hide data and playground" aria-label="Show or hide data and playground" aria-expanded="true" data-icon="Database"></button>
        <button id="cancel-query" title="Cancel running query" aria-label="Cancel running query" data-icon="Square" disabled></button>
      </div>
      <!-- Graded question sections injected here by app.js -->
      <div id="questions-container"></div>
    </main>

    <div id="panel-resize-handle" class="panel-resize-handle" aria-hidden="true"></div>

    <aside id="right-panel" class="right-panel">
      <div class="right-panel-header">
        <span class="right-panel-title">Playground</span>
        <div class="right-panel-header-controls">
          <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle light/dark mode">&#9788;</button>
          <button id="fn-ref-open-btn" class="fn-ref-open-btn" aria-label="Open SQLite reference" aria-expanded="false" title="Open SQLite reference">SQLite Ref</button>
          <button id="schema-toggle-btn" class="schema-toggle-btn" aria-label="Toggle schema panel" aria-expanded="true">&#9650;</button>
        </div>
      </div>

      <div id="fn-ref-popover" class="fn-ref-popover hidden" role="dialog" aria-label="SQLite reference">
        <div class="fn-ref-popover-header">
          <span class="fn-ref-popover-title">SQLite Reference</span>
          <div class="fn-ref-popover-actions">
            <button id="fn-ref-pin-btn" class="fn-ref-mini-btn" aria-pressed="false" title="Pin reference panel">Pin</button>
            <button id="fn-ref-close-btn" class="fn-ref-mini-btn" title="Hide reference panel">Hide</button>
          </div>
        </div>
        <input id="fn-ref-search" class="fn-ref-search" type="text" placeholder="Search functions..." aria-label="Search functions" autocomplete="off" spellcheck="false">
        <div id="fn-ref-body-wrap" class="fn-ref-body-wrap">
          <div id="fn-ref-body" class="fn-ref-body"></div>
        </div>
      </div>

      <div id="playground-schema-section" class="playground-schema-section">
        <label class="sr-only" for="schema-search">Search tables and columns</label>
        <input id="schema-search" type="search" placeholder="Find a table or column" />
        <div id="playground-schema-info" class="playground-schema-info"></div>
      </div>
      <div id="schema-resize-handle" class="schema-resize-handle" aria-hidden="true"></div>
      <div class="playground-editor-wrap">
        <div id="playground-editor" class="cm-editor-container" aria-label="Playground SQL editor"></div>
        <div class="editor-buttons">
          <button class="btn-run" data-context="playground" aria-label="Run playground query">Run</button>
          <button class="btn-format" data-context="playground" aria-label="Format playground SQL">Format</button>
          <button id="playground-selection" disabled title="Run selected SQL (Ctrl/Cmd+Shift+Enter)">Run selection</button>
        </div>
        <div id="playground-status" class="status-area" role="status" aria-live="polite"></div>
      </div>
      <div class="right-panel-scroll">
        <div id="playground-results" class="results-area playground-results"></div>

        <div class="rp-section">
          <div class="rp-section-header" id="query-history-section-header">
            <span class="rp-section-label">Query History</span>
            <button class="rp-section-toggle" id="query-history-toggle" aria-expanded="false">&#9660;</button>
          </div>
          <div class="rp-section-body hidden" id="query-history-body"></div>
        </div>
      </div>
    </aside>
  </div>

  <dialog id="finish-dialog" aria-labelledby="finish-heading">
    <h2 id="finish-heading">Review your submission</h2>
    <div id="finish-summary"></div>
    <div class="dialog-actions">
      <button id="finish-back">Keep working</button>
      <button id="finish-json">Download JSON</button>
      <button id="finish-download" class="btn-primary">Download report</button>
    </div>
  </dialog>


  <!-- assessment-builder v2.1 | column-output-convention: all SELECT aliases require trailing _ suffix per schema audit protocol; see SQL_SCHEMA_JSON._output_convention -->
  <script>
var SQL_JS_WASM_B64 = "__SQL_JS_WASM_B64__";
var DATASET_DB_B64 = "__DATASET_DB_B64__";
var QUESTIONS_JSON = __QUESTIONS_JSON__;
var ANSWER_HASHES_JSON = __ANSWER_HASHES_JSON__;
var SQL_SCHEMA_JSON = __SQL_SCHEMA_JSON__;
var MODULE_TITLE = __MODULE_TITLE_JSON__;
var MODULE_VERSION = __MODULE_VERSION_JSON__;
var MODULE_DESCRIPTION = __MODULE_DESCRIPTION_JSON__;
var MODULE_ID = __MODULE_ID_JSON__;
var BUILD_ID = __BUILD_ID_JSON__;
var PAYLOAD_ENCODING = "gzip";
var WORKER_SOURCE = __WORKER_SOURCE_JSON__;
  </script>
  <script>
__GRADING_LOGIC_JS__
  </script>
  <script>
__CM_EDITOR_BUNDLE_JS__
  </script>
  <script>
__APP_JS__
  </script>
</body>
</html>
